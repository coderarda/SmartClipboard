# This workflow will build, sign, and package a WinUI 3 MSIX desktop application
# built on .NET.

name: WinUI 3 MSIX app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, x86]

    runs-on: windows-latest

    env:
      Solution_Name: SmartClipboard.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if signing is available
      id: check-signing
      env:
        SIGNING_PASSWORD:  ${{ secrets.SIGNING_PASSWORD }}
      run: |
        if ([string]::IsNullOrEmpty($env:SIGNING_PASSWORD)) {
          echo "signing_available=false" >> $env:GITHUB_OUTPUT
        } else {
          echo "signing_available=true" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh
    
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Decode the pfx
      if: steps.check-signing.outputs.signing_available == 'true'
      shell: pwsh
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
        [System.IO.File]::WriteAllBytes("GitHubActionsWorkflow.pfx", $pfx_cert_byte)

    - name: Verify pfx exists
      if: steps.check-signing.outputs.signing_available == 'true'
      run: |
        if (Test-Path "GitHubActionsWorkflow.pfx") {
          Write-Host "PFX file created successfully."
        } else {
          Write-Error "PFX file not found!"
        }
      shell: pwsh
      
    - name: Import signing certificate
      if: steps.check-signing.outputs.signing_available == 'true'
      shell: pwsh
      env:
        PFX_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: |
        $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
        $pfxPath = Join-Path (Get-Location) "GitHubActionsWorkflow.pfx"
        $certs = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure -Exportable
        if ($null -eq $certs -or $certs.Count -eq 0) { throw "Failed to import PFX into CurrentUser\My." }
        $thumb = ($certs | Select-Object -First 1).Thumbprint
        Write-Host "Imported certificate thumbprint: $thumb"
        echo "SigningCertThumbprint=$thumb" >> $env:GITHUB_ENV

    # Create the app package by building and packaging the project (signed)
    - name: Create the app package (signed)
      if: steps.check-signing.outputs.signing_available == 'true'
      run: >
        msbuild $env:Solution_Name
        /p:Configuration=$env:Configuration
        /p:Platform=$env:Platform
        /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode
        /p:AppxBundle=$env:Appx_Bundle
        /p:AppxPackageDir=$env:Appx_Package_Dir
        /p:GenerateAppxPackageOnBuild=true
        /p:PackageCertificateThumbprint=$env:SigningCertThumbprint
        /p:PackageCertificateKeyFile=
        /p:PackageCertificatePassword=
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Appx_Package_Dir: ${{ github.workspace }}\Packages\
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    # Create the app package (unsigned fallback when secrets not available)
    - name: Create the app package (unsigned)
      if: steps.check-signing.outputs.signing_available != 'true'
      run: >
        msbuild $env:Solution_Name
        /p:Configuration=$env:Configuration
        /p:Platform=$env:Platform
        /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode
        /p:AppxBundle=$env:Appx_Bundle
        /p:AppxPackageDir=$env:Appx_Package_Dir
        /p:GenerateAppxPackageOnBuild=true
        /p:AppxPackageSigningEnabled=false
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Appx_Package_Dir: ${{ github.workspace }}\Packages\
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Remove the pfx
      if: hashFiles('GitHubActionsWorkflow.pfx') != ''
      run: Remove-Item -path GitHubActionsWorkflow.pfx -ErrorAction SilentlyContinue
      shell: pwsh

    # Diagnostic: list what was actually built (helps debug path issues)
    - name: List Packages output
      run: |
        Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
        Write-Host "Listing root Packages folder (if exists):"
        if (Test-Path "${{ github.workspace }}\Packages") { Get-ChildItem -Recurse "${{ github.workspace }}\Packages" | Format-List FullName } else { Write-Host "No ${{ github.workspace }}\Packages folder found" }
        Write-Host "Listing project Packages folder (if exists):"
        if (Test-Path "SmartClipboard\Packages") { Get-ChildItem -Recurse "SmartClipboard\Packages" | Format-List FullName } else { Write-Host "No SmartClipboard\Packages folder found" }
        Write-Host "Fallback - search for *.msix anywhere:"
        Get-ChildItem -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object FullName | Format-List
        Get-ChildItem -Recurse -Filter *.msixbundle -ErrorAction SilentlyContinue | Select-Object FullName | Format-List
      shell: pwsh

    - name: Upload MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package (${{ matrix.configuration }}-${{ matrix.platform }})
        path: Packages/
        if-no-files-found: warn
